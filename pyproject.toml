[project]
name = "certpulse"
version = "2.4.0"
description = "CertPulse Next-Gen Authenticity Verification & Certification Intelligence Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "playwright>=1.44.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "defusedxml>=0.7.1",
    "pillow>=10.3.0",
    "imagehash>=4.3.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modernize Python syntax: PEP 585/604)
    "B",      # flake8-bugbear (common bug patterns)
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (handled by visual wrapping / formatter)
    "SIM105", # suppressable-exception (try-except-pass can be clearer than contextlib.suppress)
    "RUF012", # mutable-class-default (often required by Pydantic ConfigDict or custom registries)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

name: Submit an offer
description: Suggest a free or discounted certification offer found on a vendor page
title: "[VOUCHER]: "
labels: ["voucher-submission", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please give the vendor page and the sentence on it that states the terms. Automation only checks that the link loads on an official vendor domain; a person reads the terms before the offer is listed.
  - type: dropdown
    id: platform
    attributes:
      label: Cloud / Technology Provider
      options:
        - Microsoft Azure
        - Amazon Web Services (AWS)
        - Google Cloud (GCP)
        - Cisco
        - ISC2
        - Oracle Cloud (OCI)
        - GitHub
        - Linux Foundation / CNCF
        - Other
    validations:
      required: true
  - type: input
    id: cert_name
    attributes:
      label: Certification Name
      description: E.g., AWS Certified Cloud Practitioner, Azure AI-900, ISC2 CC
      placeholder: "e.g. AI-900: Microsoft Azure AI Fundamentals"
    validations:
      required: true
  - type: dropdown
    id: offer_type
    attributes:
      label: Offer Type
      options:
        - 100% Free Exam Voucher
        - Cloud Skills Challenge to Earn Voucher
        - Free Accredited Credential / Badge
        - Free Continuing Education (CE) Credits
        - Student Discount / Scholarship
    validations:
      required: true
  - type: textarea
    id: evidence_quote
    attributes:
      label: Sentence on the vendor page that states the terms
      description: Copy it exactly, including any fee, eligibility limit or end date.
    validations:
      required: true
  - type: input
    id: cost
    attributes:
      label: What the candidate pays
      description: "0 if the exam is fully free; otherwise the amount still payable."
      placeholder: "0"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official Claim Link
      description: Must be on the vendor's own domain. Do not submit voucher codes.
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: claim_instructions
    attributes:
      label: How to Claim
      description: Briefly describe the steps required to receive or redeem the voucher.
      placeholder: "Complete the 3 learning paths on MS Learn before Oct 30 to receive the voucher code by email."
    validations:
      required: true

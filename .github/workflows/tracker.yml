name: CertPulse Automated Tracker

on:
  push:
    branches:
      - main
  schedule:
    # Run every 4 hours automatically (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "certpulse-tracker"
  cancel-in-progress: false

jobs:
  test:
    name: Test Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-xdist pytest-asyncio
          python -m playwright install --with-deps chromium || true

      - name: Validate JSON Schema Compliance
        run: |
          python -c "
          import json, jsonschema
          from pathlib import Path
          schema = json.loads(Path('data/schema.json').read_text(encoding='utf-8'))
          data = json.loads(Path('data/offers.json').read_text(encoding='utf-8'))
          jsonschema.validate(data, schema)
          news_schema = json.loads(Path('data/news_schema.json').read_text(encoding='utf-8'))
          news_data = json.loads(Path('data/news.json').read_text(encoding='utf-8'))
          jsonschema.validate(news_data, news_schema)
          print('Schema validation passed.')
          "

      - name: Parallelized Test Discovery
        run: |
          pytest tests/ -n auto --dist loadscope -v

      - name: Run E2E Test Suite
        run: |
          python tests/e2e/runner.py

  update-and-deploy:
    name: Live Pipeline Execution & Data Update
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-xdist pytest-asyncio
          python -m playwright install --with-deps chromium || true

      - name: Run CertPulse Pipeline
        run: |
          python -m src.main

      - name: Run End-to-End Invariant Verification
        run: |
          python tests/e2e/runner.py

      - name: Commit and Push Changes If Updated
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): auto-update courses, vouchers, and news feed [skip ci]"
          file_pattern: "README.md data/*.json data/*.jsonl docs/index.html docs/*.md docs/screenshots/*.png"
          commit_user_name: "CertPulse Bot"
          commit_user_email: "actions@github.com"
          commit_author: "CertPulse Bot <actions@github.com>"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs/"

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: update-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

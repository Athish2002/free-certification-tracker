name: CertPulse Automated Tracker

on:
  schedule:
    # Run every 4 hours automatically (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "certpulse-tracker"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx jinja2 pytest

      - name: Run CertPulse Pipeline
        run: |
          python -m src.main

      - name: Run End-to-End Invariant Verification
        run: |
          pytest tests/ -v

      - name: Commit and Push Changes If Updated
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): auto-update certification tracker [skip ci]"
          file_pattern: "README.md data/*.json docs/index.html"
          commit_user_name: "CertPulse Bot"
          commit_user_email: "actions@github.com"
          commit_author: "CertPulse Bot <actions@github.com>"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs/"

  deploy-pages:
    needs: update-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
